name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: pip install -e ".[ui]"
      - name: tests
        run: python -m unittest discover -s tests -t . -v
      - name: cli smoke
        run: |
          guild --version
          guild cat > /dev/null
          guild > /dev/null
          tmp=$(mktemp -d)
          GUILD_CLIENTS="$tmp/clients" GUILD_STATE="$tmp/state" guild new demo \
            --kunde "Demo" --produkt "Test" --zielgruppe "niemand" \
            --ziel "ein Ziel" --seite index.html
          GUILD_CLIENTS="$tmp/clients" GUILD_STATE="$tmp/state" guild plan demo > /dev/null
